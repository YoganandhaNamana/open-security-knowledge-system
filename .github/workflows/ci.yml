name: OSKS CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: osks
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        working-directory: osks
        run: pytest tests/ -v

      - name: Run QA validation on pilot module (NET-101)
        working-directory: osks
        run: python main.py --module NET-101 --qa-only

      - name: Generate verified OSKS exports
        working-directory: osks
        run: python -m engines.exporter

      - name: Decision #5 traceability gate
        working-directory: osks
        run: pytest tests/test_exporter.py -k traceability -v

      - name: Full per-module schema validation
        working-directory: osks
        run: pytest tests/test_schema.py tests/test_exporter.py -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Build MkDocs site
        working-directory: osks
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: Deploy build output to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: Report status
        if: always()
        run: echo "CI run complete. Check the steps above for pass/fail details."
