name: OSKS CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest tests/ -v

      - name: Run QA validation on pilot module (NET-101)
        run: python main.py --module NET-101 --qa-only

      - name: Build MkDocs site
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: Report status
        if: always()
        run: echo "CI run complete. Check the steps above for pass/fail details."
